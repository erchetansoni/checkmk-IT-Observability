##################################
# For the Checkmk server
# Author: Chetan Soni
##################################

##################################
# PLEASE NOTE
# The Checkmk server initiates outbound connections to agents on TCP 6556.
# The server itself does not listen on this port.
##################################

services:
  checkmk:
    image: checkmk/check-mk-raw:2.4.0-latest
    container_name: checkmk_master
    hostname: checkmk
    restart: unless-stopped
    stop_grace_period: 60s 

    ports:
      # - "80:5000"       # Required: Web interface (Change 80 to another port if needed) 
      - "8000:8000"     # Required: Agent Receiver
      - "162:162/udp"   # Optional: SNMP Trap receiver
      - "514:514/udp"   # Optional: Syslog receiver
    volumes:
      - checkmk_data:/omd/sites
      - /etc/localtime:/etc/localtime:ro  # Syncs host time zone with the container

    tmpfs:
      - /opt/omd/sites/monitoring/tmp:uid=1000,gid=1000

    environment:
      - TZ=Asia/Kolkata
      - CMK_PASSWORD=ChangeMe123!         # Sets the default username as "cmkadmin" with password as "ChangeMe123!".
      - CMK_SITE_ID=monitoring            # The name of your monitoring site
      
      # For mail notifications (uncomment and set a real relay host/service — "postfix" is not defined in this compose file)
      # - MAIL_RELAY_HOST=postfix
      # - MAIL_RELAY_PORT=587
      # - MAIL_RELAY_USERNAME=your-email@gmail.com
      # - MAIL_RELAY_PASSWORD=your-password
      # - MAIL_FROM=your-email@gmail.com
      # - MAIL_TO=your-email@gmail.com
      

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:latest
    container_name: caddy
    hostname: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      checkmk:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  checkmk_data:
  caddy_data:
  caddy_config: