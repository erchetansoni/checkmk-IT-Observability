##################################
# For the Checkmk server
# Author: Chetan Soni
##################################

##################################
# PLEASE NOTE
# The Checkmk server initiates outbound connections to agents on TCP 6556.
# The server itself does not listen on this port.
##################################

services:
  checkmk:
    image: checkmk/check-mk-raw:2.4.0-latest
    container_name: checkmk_master
    hostname: checkmk
    restart: unless-stopped
    stop_grace_period: 60s 

    ports:
      # - "80:5000"       # Required: Web interface (Change 80 to another port if needed) 
      - "8000:8000"     # Required: Agent Receiver
      - "162:162/udp"   # Optional: SNMP Trap receiver
      - "514:514/udp"   # Optional: Syslog receiver
    volumes:
      - checkmk_data:/omd/sites
      - /etc/localtime:/etc/localtime:ro  # Syncs host time zone with the container

    tmpfs:
      - /opt/omd/sites/monitoring/tmp:uid=1000,gid=1000

    environment:
      - TZ=Asia/Kolkata
      - CMK_PASSWORD=ChangeMe123!         # Sets the default username as "cmkadmin" with password as "ChangeMe123!".
      - CMK_SITE_ID=monitoring            # The name of your monitoring site
      
      # Mail notifications: this image only supports MAIL_RELAY_HOST, and it is an
      # UNAUTHENTICATED smarthost only (no username/password support at this level).
      # For an authenticated relay like Office 365, do NOT use this variable — instead
      # configure SMTP auth directly in the Web UI:
      # Setup > Events > Notifications > Parameters for notification methods > HTML Email
      # - MAIL_RELAY_HOST=mailrelay.example.com
      

    healthcheck:
      test: ["CMD", "curl", "-f", "http://checkmk:5000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:latest
    container_name: caddy
    hostname: caddy
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"
    
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./caddy_cert:/data
      - caddy_config:/config
    
    depends_on:
      checkmk:
        condition: service_healthy
    
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  #####################################################
  # SMTP Relay (Gmail)
  # For Reference: https://www.postfix.org/postconf.5.html
  # Docker Hub: https://hub.docker.com/r/boky/postfix
  #####################################################

  mailrelay:
    image: boky/postfix
    container_name: mailrelay
    hostname: mailrelay
    restart: unless-stopped

    environment:
      # SMTP Server
      RELAYHOST : "[smtp.office365.com]:587"

      RELAYHOST_TLS_LEVEL: "may"

      # Account
      RELAYHOST_USERNAME: "YOUR_EMAIL@example.com"

      # Account Password
      RELAYHOST_PASSWORD: "YOUR_PASSWORD"

      # Allowed sender domain
      ALLOWED_SENDER_DOMAINS: "*"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"


volumes:
  checkmk_data:
  caddy_config:
