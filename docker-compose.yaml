##################################
# For the Checkmk server
# Author: Chetan Soni
##################################

##################################
# PLEASE NOTE
# The Checkmk server initiates outbound connections to agents on TCP 6556.
# The server itself does not listen on this port.
##################################

services:
  checkmk:
    image: checkmk/check-mk-raw:2.4.0-latest
    container_name: checkmk_master
    hostname: checkmk
    restart: unless-stopped
    stop_grace_period: 60s 

    ports:
      # - "80:5000"       # Required: Web interface (Change 80 to another port if needed) 
      - "8000:8000"     # Required: Agent Receiver
      - "162:162/udp"   # Optional: SNMP Trap receiver
      - "514:514/udp"   # Optional: Syslog receiver
    volumes:
      - ./backup-files:/home/backup-files
      - ./checkmk_data:/omd/sites
      - /etc/localtime:/etc/localtime:ro  # Syncs host time zone with the container

    tmpfs:
      - /opt/omd/sites/monitoring/tmp:uid=1000,gid=1000

    environment:
      - TZ=Asia/Kolkata
      - CMK_PASSWORD=ChangeMe123!         # Sets the default username as "cmkadmin" with password as "ChangeMe123!".
      - CMK_SITE_ID=monitoring            # The name of your monitoring site
      
      # Mail notifications: this image only supports MAIL_RELAY_HOST, and it is an
      # UNAUTHENTICATED smarthost only (no username/password support at this level).
      # For an authenticated relay like Office 365, do NOT use this variable — instead
      # configure SMTP auth directly in the Web UI:
      # Setup > Events > Notifications > Parameters for notification methods > HTML Email
      # - MAIL_RELAY_HOST=mailrelay.example.com
      
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ot-monitoring.rule=Host(`in-ot-monitoring.avgol.com`)"
      - "traefik.http.routers.ot-monitoring.entrypoints=websecure"
      - "traefik.http.routers.ot-monitoring.tls=true"
      - "traefik.http.services.ot-monitoring.loadbalancer.server.port=5000"

    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "10", "http://127.0.0.1:5000/monitoring/"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  traefik:
    image: traefik:v3.7.10
    container_name: traefik
    hostname: traefik
    restart: unless-stopped

    command:
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.filename=/etc/traefik/dynamic/tls.yaml"
      - "--providers.file.watch=true"
      - "--global.checknewversion=false"
      - "--global.sendanonymoususage=false"
      - "--log.level=INFO"

    ports:
      - "80:80"
      - "443:443"
    
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/tls.yaml:/etc/traefik/dynamic/tls.yaml:ro
      - ./traefik/certs:/certs:ro
    
    depends_on:
      checkmk:
        condition: service_healthy
    
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  #####################################################
  # SMTP Relay (Gmail)
  # For Reference: https://www.postfix.org/postconf.5.html
  # Docker Hub: https://hub.docker.com/r/boky/postfix
  #####################################################

  mailrelay:
    image: boky/postfix
    container_name: mailrelay
    hostname: mailrelay
    restart: unless-stopped

    environment:
      # SMTP Server
      RELAYHOST : "[smtp.office365.com]:587"

      RELAYHOST_TLS_LEVEL: "may"

      # Account
      RELAYHOST_USERNAME: "YOUR_EMAIL@example.com"

      # Account Password
      RELAYHOST_PASSWORD: "YOUR_PASSWORD"

      # Allowed sender domain
      ALLOWED_SENDER_DOMAINS: "*"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
